name: CI

# The repo is private, so every minute here is billed. Each push and pull
# request runs the checks and the browser tests in Chromium. Firefox and
# WebKit run on pull requests, by hand, and each night when main changed
# that day. Changes to docs alone run nothing.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', 'packages/*/*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md', 'packages/*/*.md']
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

concurrency:
  # The nightly run must not cancel a push's run, or a push the nightly run.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails when npm install would change package-lock.json. npm 11 is
      # stricter than the npm 10 that ships with Node 22: it also drops
      # stale entries, such as workspaces that no longer exist.
      - run: npx -y npm@11 install --package-lock-only --ignore-scripts --no-audit --no-fund && git diff --exit-code package-lock.json
      - run: npm run typecheck
      - run: npm test
      # Slow Markdown inputs: time must grow with the input, not faster.
      - run: npm run test:timing
      - run: npm run build
      # A report in the run summary, not a gate: there is no size limit.
      - run: node packages/editor/scripts/size.mjs >> "$GITHUB_STEP_SUMMARY"
      - run: npm pack --dry-run -w @usememos/editor

  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium --project=themed
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  # The nightly run tests main only when it has a commit from the last day.
  changed:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      recent: ${{ steps.age.outputs.recent }}
    steps:
      - uses: actions/checkout@v4
      - id: age
        run: echo "recent=$(( $(date +%s) - $(git log -1 --format=%ct) < 86400 ))" >> "$GITHUB_OUTPUT"

  # Each browser in two shards, so the four jobs run side by side.
  e2e-firefox-webkit:
    needs: changed
    if: ${{ !cancelled() && github.event_name != 'push' && (github.event_name != 'schedule' || needs.changed.outputs.recent == '1') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results
          retention-days: 7
