name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails when npm install would change package-lock.json. npm 11 is
      # stricter than the npm 10 that ships with Node 22: it also drops
      # stale entries, such as workspaces that no longer exist.
      - run: npx -y npm@11 install --package-lock-only --ignore-scripts --no-audit --no-fund && git diff --exit-code package-lock.json
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # A report in the run summary, not a gate: there is no size limit.
      - run: node packages/editor/scripts/size.mjs >> "$GITHUB_STEP_SUMMARY"
      - run: npm pack --dry-run -w @usememos/editor

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium --project=themed
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  # Each browser in two shards, so the four jobs run side by side.
  e2e-firefox-webkit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results
          retention-days: 7
