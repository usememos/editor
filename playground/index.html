<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>editor playground</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: light-dark(#f7f6f2, #1e2024); --card: light-dark(#fff, #25272b); --line: light-dark(#e6e4dd, #383b40);
        --muted: light-dark(#8b8a85, #a3a7ad); --text: light-dark(#2b2a26, #e2e4e7); --accent: light-dark(oklch(0.45 0.08 250), oklch(0.66 0.11 250));
      }
      body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--text); }
      main { max-width: 680px; margin: 40px auto; padding: 0 16px 40px; }
      nav { display: flex; gap: 12px; margin-bottom: 16px; font-size: 13px; color: var(--muted); }
      nav a { color: inherit; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px 8px; }
      .card:focus-within { border-color: color-mix(in oklab, var(--accent) 40%, var(--line)); }
      #editor { min-height: 120px; max-height: 60vh; overflow: auto; }
      .bar { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; padding-top: 8px; margin-top: 8px; border-top: 1px solid var(--line); }
      .bar button { font: inherit; font-size: 13px; min-width: 28px; padding: 3px 8px; border-radius: 6px; border: none; background: none; color: var(--muted); cursor: pointer; }
      .bar button:hover { background: color-mix(in oklab, var(--muted) 15%, transparent); color: var(--text); }
      .bar button.on { color: var(--accent); background: color-mix(in oklab, var(--accent) 12%, transparent); }
      .bar button.primary { color: var(--card); background: var(--accent); padding: 3px 12px; margin-left: 4px; }
      .bar .spacer { flex: 1; }
      /* App styles for decorations and widgets. */
      .tag { color: var(--accent); }
      .mention { color: var(--accent); }
      .upload { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); padding: 6px 10px; border: 1px dashed var(--line); border-radius: 8px; }
      .upload progress { width: 120px; }
      h2.label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 24px 0 8px; }
      pre#output, #saved pre { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; font-size: 13px; white-space: pre-wrap; margin: 0; }
      #saved { list-style: none; padding: 0; margin: 0; }
      #saved li { margin-bottom: 8px; }
      p.help { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0 0 12px; }
    </style>
  </head>
  <body>
    <main>
      <nav><strong>Core</strong> · <a href="./react.html">React</a> · <a href="?empty">Empty</a> · <a href="?plain">Plain CommonMark</a> · <a href="?base">base.css only</a></nav>
      <p class="help">
        Type <code>/</code> for blocks and <code>#</code> for tags. Paste or drop an image to see an upload placeholder.
        Ctrl/⌘+Enter saves. The draft and the caret are kept across reloads.
      </p>
      <div class="card">
        <div id="editor"></div>
        <div class="bar" id="bar"></div>
      </div>
      <h2 class="label">Markdown output</h2>
      <pre id="output"></pre>
      <h2 class="label">Saved</h2>
      <ul id="saved"></ul>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
